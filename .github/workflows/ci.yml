name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kuyumbank_ci
          POSTGRES_USER: kuyumbank
          POSTGRES_PASSWORD: kuyumbank
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kuyumbank -d kuyumbank_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-only-not-a-secret-change-me
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: kuyumbank_ci
      DB_USER: kuyumbank
      DB_PASSWORD: kuyumbank
      DB_HOST: localhost
      DB_PORT: "5432"
      SECURE_SSL_REDIRECT: "False"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/config/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/config/requirements.txt

      - name: Docs sync check
        run: python scripts/docs_sync.py --check

      - name: Docs lint (uyarı; soft)
        continue-on-error: true
        run: python scripts/docs_sync.py --lint-docs-strict

      - name: OpenAPI schema drift
        run: python scripts/export_openapi.py --check

      - name: Django system check
        working-directory: backend/config
        run: python manage.py check

      - name: Migration check
        working-directory: backend/config
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite
        working-directory: backend/config
        run: >
          python manage.py test
          firmalar.tests urunler.tests fiyatlama.tests tanimlar.tests
          stok.tests siparis.tests finans.tests kalite.tests lojistik.tests belgeler.tests api.tests
          --verbosity=1 --keepdb
