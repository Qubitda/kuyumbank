<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kuyumbank Alıcı{% endblock %}</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --text: #e8eef4;
      --muted: #9aabbc;
      --accent: #c4a35a;
      --line: #2a3542;
      --danger: #c45c5c;
      --ok: #5a9e6f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1c2836, var(--bg));
      color: var(--text);
      min-height: 100vh;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header {
      display: flex;
      gap: 1.25rem;
      align-items: center;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--line);
      background: rgba(15, 20, 25, 0.85);
    }
    header strong { letter-spacing: 0.04em; color: var(--accent); }
    header nav { display: flex; gap: 1rem; flex: 1; }
    main { max-width: 920px; margin: 0 auto; padding: 1.5rem; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 1.25rem;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.55rem 0.4rem; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; font-size: 0.85rem; }
    .muted { color: var(--muted); }
    .messages { list-style: none; padding: 0; margin: 0 0 1rem; }
    .messages li { padding: 0.6rem 0.8rem; border-radius: 6px; margin-bottom: 0.4rem; }
    .messages .error { background: rgba(196, 92, 92, 0.2); color: #f0c0c0; }
    .messages .success { background: rgba(90, 158, 111, 0.2); color: #c5e6cf; }
    button, .btn {
      appearance: none;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #1a1408;
      font-weight: 600;
      padding: 0.55rem 1rem;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover, .btn:hover { filter: brightness(1.05); }
    input[type=text], input[type=password] {
      width: 100%;
      padding: 0.55rem 0.7rem;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #12181f;
      color: var(--text);
    }
    label { display: block; margin: 0.75rem 0 0.3rem; color: var(--muted); font-size: 0.9rem; }
    .stack { display: grid; gap: 0.75rem; }
  </style>
</head>
<body>
  <header>
    <strong>KUYUMBANK</strong>
    {% if user.is_authenticated %}
    <nav>
      <a href="{% url 'buyer-cart' %}">Sepet</a>
      <a href="{% url 'buyer-order-list' %}">Siparişler</a>
      <a href="{% url 'buyer-finance' %}">Finans</a>
    </nav>
    <span class="muted">{{ user.username }}</span>
    <a href="{% url 'buyer-logout' %}">Çıkış</a>
    {% endif %}
  </header>
  <main>
    {% if messages %}
    <ul class="messages">
      {% for message in messages %}
      <li class="{{ message.tags }}">{{ message }}</li>
      {% endfor %}
    </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
