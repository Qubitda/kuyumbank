{% extends "buyer/base.html" %}
{% block title %}RFQ oluştur — Kuyumbank Alıcı{% endblock %}
{% block content %}
<section class="panel" style="max-width:520px">
  <h1 style="margin-top:0;">Yeni RFQ talebi</h1>
  <p class="muted">F10-021 katalog dışı · F10-022 özel üretim (varyantsız; kör platform).</p>
  <form method="post" class="stack">
    {% csrf_token %}
    <div>
      <label for="id_talep_tipi">Talep tipi</label>
      <select id="id_talep_tipi" name="talep_tipi" style="width:100%;padding:0.55rem;border-radius:6px;border:1px solid var(--line);background:#12181f;color:var(--text)">
        <option value="KATALOG_DISI" selected>Katalog dışı</option>
        <option value="OZEL_URETIM">Özel üretim / tasarım</option>
        <option value="STANDART">Standart</option>
      </select>
    </div>
    <div>
      <label for="id_baslik">Başlık</label>
      <input id="id_baslik" type="text" name="baslik" maxlength="200" placeholder="Örn. özel bilezik talebi">
    </div>
    <div>
      <label for="id_aciklama">Açıklama *</label>
      <input id="id_aciklama" type="text" name="aciklama" maxlength="255" required>
    </div>
    <div>
      <label for="id_miktar">Miktar *</label>
      <input id="id_miktar" type="text" name="miktar" value="1" required>
    </div>
    <div>
      <label for="id_birim">Birim</label>
      <input id="id_birim" type="text" name="birim" value="ADET">
    </div>
    <button type="submit">Oluştur</button>
    <a href="{% url 'buyer-rfq-list' %}">Listeye dön</a>
  </form>
</section>
{% endblock %}
