{% extends "buyer/base.html" %}
{% block title %}Giriş — Kuyumbank Alıcı{% endblock %}
{% block content %}
<section class="panel" style="max-width:380px;margin:2rem auto;">
  <h1 style="margin-top:0;">Alıcı girişi</h1>
  <p class="muted">Alıcı portal girişi (ADR-0016 / F9-010).</p>
  <form method="post" class="stack">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div>
      <label for="id_username">Kullanıcı</label>
      {{ form.username }}
    </div>
    <div>
      <label for="id_password">Şifre</label>
      {{ form.password }}
    </div>
    <button type="submit">Giriş</button>
  </form>
</section>
{% endblock %}
